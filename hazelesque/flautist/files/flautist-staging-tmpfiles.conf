# Staging instance: directory layout under /srv/data/staging/flautist.
# Mirror of demo's layout, scoped to the staging ZFS dataset
# and the _flautist-staging UID.  See flautist-demo-tmpfiles.conf
# for rationale on perm choices + the auth-acl.toml caveat.
# Quick-start:
#     install -o _flautist-staging -g _flautist-staging -m 0640 \
#         /usr/share/flautist/auth-acl.toml.example \
#         /srv/data/staging/flautist/etc/auth-acl.toml
d /srv/data/staging                       0755 root                root                -
d /srv/data/staging/flautist              0755 _flautist-staging   _flautist-staging   -
d /srv/data/staging/flautist/repo         0750 _flautist-staging   _flautist-staging   -
d /srv/data/staging/flautist/etc          0750 _flautist-staging   _flautist-staging   -
