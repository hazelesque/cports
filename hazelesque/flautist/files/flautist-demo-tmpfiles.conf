# Demo instance: directory layout under /srv/data/demo/flautist.
# The /srv/data/demo dataset is operator-provisioned ZFS; these
# entries materialise the per-service subdirs with the right
# ownership + perms once the ZFS dataset is mounted.
#
# IMPORTANT: /srv/data/demo/flautist/etc/auth-acl.toml MUST be
# provisioned out of band before the dinit service starts, or
# `f7 serve` will fail-closed.  Reference + comments at:
#     /usr/share/flautist/auth-acl.toml.example
# Copy it across + edit, e.g.:
#     install -o _flautist-demo -g _flautist-demo -m 0640 \
#         /usr/share/flautist/auth-acl.toml.example \
#         /srv/data/demo/flautist/etc/auth-acl.toml
d /srv/data/demo                       0755 root             root             -
d /srv/data/demo/flautist              0755 _flautist-demo   _flautist-demo   -
d /srv/data/demo/flautist/repo         0750 _flautist-demo   _flautist-demo   -
d /srv/data/demo/flautist/etc          0750 _flautist-demo   _flautist-demo   -
