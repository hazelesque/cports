# Mirror layout under /srv/data/pkg-mirror.  The repo itself is
# populated out of band by pkgrecv (run as _pkg6depotd or chown
# after); the depot serves it readonly.
d /srv/data                       0755 root          root          -
d /srv/data/pkg-mirror            0755 _pkg6depotd   _pkg6depotd   -
d /srv/data/pkg-mirror/etc        0750 _pkg6depotd   _pkg6depotd   -
d /srv/data/pkg-mirror/repo       0750 _pkg6depotd   _pkg6depotd   -
