# Staging instance: directory layout under /srv/data/staging/withy.
# Mirror of demo's layout, scoped to the staging ZFS dataset
# and the _withy-staging UID.  See withy-demo-tmpfiles.conf
# for the rationale on perm choices.
d /srv/data/staging                   0755 root            root            -
d /srv/data/staging/withy             0755 _withy-staging  _withy-staging  -
d /srv/data/staging/withy/db          0750 _withy-staging  _withy-staging  -
d /srv/data/staging/withy/etc         0750 _withy-staging  _withy-staging  -
d /srv/data/staging/withy/flautist-cache 0750 _withy-staging _withy-staging -
