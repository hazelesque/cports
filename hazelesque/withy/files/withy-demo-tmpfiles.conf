# Demo instance: directory layout under /srv/data/demo/withy.
# The /srv/data/demo dataset itself is operator-provisioned
# ZFS (so demo / staging / prod can be snapshotted as siblings
# under /srv/data); these tmpfiles entries materialise the
# per-service subdirectories with the right ownership +
# perms when the ZFS dataset is mounted.
#
# 0750 on dirs that hold secrets (etc) + DB; 0755 on the
# top-level so a future operator-readable subdir (e.g.
# `public` for static seeds) can be added without
# re-permissioning everything above it.
d /srv/data/demo                   0755 root         root         -
d /srv/data/demo/withy             0755 _withy-demo  _withy-demo  -
d /srv/data/demo/withy/db          0750 _withy-demo  _withy-demo  -
d /srv/data/demo/withy/etc         0750 _withy-demo  _withy-demo  -
d /srv/data/demo/withy/flautist-cache 0750 _withy-demo _withy-demo -
