# Caddy state lives in /var/lib/caddy by default; ACME cert
# storage, OCSP cache, etc.  /etc/caddy holds the Caddyfile +
# any operator-provided extra config snippets.  /var/log/caddy
# for access logs if Caddyfile enables them.
d /var/lib/caddy   0750 _caddy _caddy -
d /etc/caddy       0755 root   root   -
d /var/log/caddy   0750 _caddy _caddy -
